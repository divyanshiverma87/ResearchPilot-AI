<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Center gradient shield/circle -->
  <circle cx="50" cy="50" r="30" fill="url(#grad)" />
  
  <!-- Stylized navigation pilot shape (pointing up-right) -->
  <path d="M50 32 L64 60 L50 52 L36 60 Z" fill="#ffffff" transform="rotate(45 50 50)" />
</svg>
